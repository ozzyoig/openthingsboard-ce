@if (isExternal) {
  <a [href]="link" [target]="target">
    <ng-container *ngTemplateOutlet="logo"></ng-container>
  </a>
} @else {
  <a [routerLink]="link" [target]="target">
    <ng-container *ngTemplateOutlet="logo"></ng-container>
  </a>
}

<ng-template #logo>
  <div class="tb-brand-logo">
    <img [src]="brandingEnabled ? ((login ? branding.value.loginLogo || branding.value.logo : branding.value.logo) || src) : src"
         [alt]="brandingEnabled ? branding.value.appName : 'Logo'"/>
    @if (brandingEnabled) { <span>{{ branding.value.appName }}</span> }
  </div>
</ng-template>
